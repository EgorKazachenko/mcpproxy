# node-modules, а не PnP: Electron и native-модули с PnP работают плохо,
# а sandbox-runtime резолвит бинари по путям в node_modules.
nodeLinker: node-modules

enableGlobalCache: true
compressionLevel: mixed

# plugin-typescript в Yarn 4 встроен — импортировать не нужно.
# Включаем явно, чтобы поведение было видно в конфиге, а не подразумевалось:
# при `yarn add x` соответствующий @types/x попадёт в devDependencies сам.
tsEnableAutoTypes: true
